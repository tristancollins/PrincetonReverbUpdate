name: Generate schematic PDF
on:
  push:
    branches:
      - main
      - mods
      - mods-pcb
      - fab
      - fab_updates
      - updates
  pull_request:
jobs:
  generate-schematic-pdf:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run KiCad actions (KiCad 10)
        uses: actions-for-kicad/kicad-actions@v2.0-k10.0
        with:
          schematic_file_name: ./PrincetonReverbUpdate.kicad_sch
          schematic_output_pdf: true
          schematic_output_pdf_file_name: PrincetonReverbUpdate.pdf
          schematic_output_black_white: true
          # PCB render
          pcb_file_name: ./PrincetonReverbUpdate.kicad_pcb
          pcb_output_image: true
          pcb_output_image_width: 3200
          pcb_output_image_height: 1800
          pcb_output_image_quality: user
          pcb_output_image_file_name: PrincetonReverbUpdate-render.png
      - name: Move outputs into folders
        run: |
          mkdir -p schematic pcb
          mv PrincetonReverbUpdate.pdf schematic/PrincetonReverbUpdate.pdf
          mv PrincetonReverbUpdate-render.png pcb/PrincetonReverbUpdate-render.png
      - name: Commit and push outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schematic/PrincetonReverbUpdate.pdf pcb/PrincetonReverbUpdate-render.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update schematic PDF and PCB render [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
